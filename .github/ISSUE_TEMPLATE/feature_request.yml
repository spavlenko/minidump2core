name: Feature Request
description: Suggest an improvement or new feature for md2core
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make md2core better? Describe it below.

  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      description: What problem does this feature solve? What use case does it enable?
      placeholder: I'm trying to do X but currently can't because...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature or behavior you'd like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative approaches or workarounds?
    validations:
      required: false
